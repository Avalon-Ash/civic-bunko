<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>civic-bunko 手感原型</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;700;900&display=swap">
<style>
/* 版面：單欄手機 App。上方大標題、中間一次一張卡、下方 iOS 分頁列。貼紙感＝粗棕線＋下壓陰影。 */
:root{
  --sky:#e6f4fa; --milk:#fffdf9; --ink:#5a4636; --ink2:#9b8878; --hair:#eadfd3;
  --pink:#ffc2cf; --pink-deep:#ee8199; --mint:#c4ebd3; --butter:#ffe9a8;
  --red:#d9435c; --red-bg:#ffe1e6; --green:#2f8f5b; --green-bg:#dcf5e5;
  --blue:#2f76b8; --blue-bg:#dfedfb; --orange:#c9741a; --orange-bg:#ffe9cc;
  --font:'Chiron GoRound TC','PingFang TC',-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;
  --r:22px;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  background:linear-gradient(var(--sky) 0,#f3fbf4 62%,#dff3dc 100%);position:relative;overflow:hidden}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:16px;
  padding-block:14px 20px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
h1{font-size:32px;font-weight:900;margin:0;letter-spacing:.02em}
h2{font-size:15px;font-weight:700;margin:0;color:var(--ink2);letter-spacing:.08em}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.sub{font-size:13px;color:var(--ink2)}

/* 貼紙卡與按鈕 */
.card{background:var(--milk);border:2.5px solid var(--ink);border-radius:var(--r);box-shadow:0 4px 0 var(--ink);padding:16px}
.press{transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s}
.press:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 22px;border-radius:999px;
  border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);background:var(--pink);font-weight:700;font-size:17px}
.btn.ghost{background:var(--milk)}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;
  background:var(--butter);border:2px solid var(--ink)}
.chip.plain{background:transparent;border-color:var(--hair);color:var(--ink2);font-weight:500}

/* 今日 */
.count{display:flex;align-items:center;gap:14px;background:var(--pink)}
.count b{font-size:60px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums}
.mission{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.dot{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-weight:900;flex:none}
.go{font-weight:900;font-size:14px;padding:6px 12px;border-radius:999px;background:var(--ink);color:var(--milk)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.week i{aspect-ratio:1;border-radius:50%;border:2.5px dashed var(--ink2);display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--ink2)}
.week i.on{border:2.5px solid var(--red);color:var(--red);font-weight:900;transform:rotate(-12deg);background:#fff}
.week i.today{border-style:solid;border-color:var(--ink);color:var(--ink);font-weight:700}

/* 題目 */
.prog{display:flex;gap:6px}
.prog i{flex:1;height:8px;border-radius:99px;background:#fff;border:2px solid var(--ink)}
.prog i.done{background:var(--mint)} .prog i.now{background:var(--pink-deep)}
.seg{display:flex;padding:3px;border-radius:999px;background:#fff;border:2px solid var(--ink);margin-left:auto}
.seg button{padding:5px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink2);min-height:32px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--milk)}
.stem{font-size:19px;font-weight:700;line-height:1.6;margin:10px 0 0}
mark{border-radius:6px;padding:1px 5px;font-weight:900}
mark.r{background:var(--red-bg);color:var(--red)} mark.b{background:var(--blue-bg);color:var(--blue)}
mark.g{background:var(--green-bg);color:var(--green)} mark.o{background:var(--orange-bg);color:var(--orange)}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:13px 14px;min-height:56px;font-size:16px;font-weight:500;border-radius:18px}
.opt .k{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-weight:900;flex:none;background:#fff}
.opt.right{background:var(--green-bg);border-color:var(--green);box-shadow:0 4px 0 var(--green)}
.opt.right .k{background:var(--green);border-color:var(--green);color:#fff}
.opt.picked{background:#f4eee8;animation:wob .35s}
.opt.dim{opacity:.5;box-shadow:0 2px 0 var(--ink)}
@keyframes wob{25%{transform:translateX(-5px)}60%{transform:translateX(4px)}}
.say{display:flex;gap:10px;align-items:flex-end;animation:pop .32s cubic-bezier(.3,1.5,.5,1)}
.bubble{flex:1;min-width:0;background:#fff;border:2.5px solid var(--ink);border-radius:20px 20px 20px 6px;padding:12px 14px;font-weight:700;font-size:16px}
.bubble small{display:block;font-weight:700;font-size:12px;color:var(--green);letter-spacing:.06em}
.bubble.miss small{color:var(--ink2)}
@keyframes pop{from{transform:scale(.9) translateY(10px);opacity:0}}
.acts{display:flex;gap:12px} .acts .btn{flex:1;padding:0 12px}

/* 口訣回饋：答對答錯都出現。圖在上、口訣一句、陷阱一句。 */
.kou{display:flex;flex-direction:column;gap:12px;background:var(--green-bg);border-color:var(--green);box-shadow:0 4px 0 var(--green);animation:pop .32s cubic-bezier(.3,1.5,.5,1)}
.kou.miss{background:var(--butter);border-color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.kou small{display:block;font-size:13px;font-weight:900;color:var(--green);letter-spacing:.04em}
.kou.miss small{color:var(--orange)}
.kou b{display:block;font-size:19px;font-weight:900;line-height:1.45}
.pic{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center}
.lane{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;font-weight:700;font-size:14px;width:100%}
.lane span{padding:5px 10px;border-radius:10px;background:#f4eee8;border:2px solid var(--hair)}
.lane .hot{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.lane .key{background:var(--green);border-color:var(--green);color:#fff;font-weight:900}
.lane i{font-style:normal;color:var(--ink2);font-weight:900}
.lane.off{opacity:.6}
.trap{display:flex;gap:8px;align-items:flex-start;font-size:15px;font-weight:700}
.trap em{font-style:normal;flex:none;font-size:12px;font-weight:900;color:#fff;background:var(--red);border-radius:8px;padding:2px 8px;margin-top:2px}

/* 回合設定：題數與快刷 */
.setup{display:flex;flex-direction:column;gap:16px}
.num{text-align:center} .num b{font-size:64px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums}
.rnd{width:54px;height:54px;border-radius:50%;border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);background:var(--butter);font-size:28px;font-weight:900;flex:none;line-height:1}
.paws{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.paw{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:16px;border:2.5px solid var(--hair);background:#fff;font-weight:900;font-size:15px;color:var(--ink2)}
.paw svg{width:26px;height:26px;fill:var(--hair)}
.paw[aria-pressed=true]{border-color:var(--ink);background:var(--pink);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.paw[aria-pressed=true] svg{fill:var(--pink-deep)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{min-height:38px;padding:0 14px;border-radius:999px;border:2.5px solid var(--hair);background:#fff;font-weight:700;font-size:14px;color:var(--ink2)}
.pick button[aria-pressed=true]{border-color:var(--ink);background:var(--mint);color:var(--ink)}
.sw{width:58px;height:34px;border-radius:999px;border:2.5px solid var(--ink);background:#fff;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:var(--ink);transition:transform .22s cubic-bezier(.3,1.6,.5,1)}
.sw[aria-checked=true]{background:var(--mint)} .sw[aria-checked=true]::after{transform:translateX(24px)}

/* 申論四格 */
.four{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cell{padding:14px 10px;text-align:center;min-height:96px;display:flex;flex-direction:column;justify-content:center;border-radius:18px}
.cell b{font-size:16px;font-weight:900}
.cell p{margin:6px 0 0;font-size:14px;font-weight:500;line-height:1.45}
.cell:nth-child(1){background:var(--butter)} .cell:nth-child(2){background:var(--blue-bg)}
.cell:nth-child(3){background:var(--red-bg)} .cell:nth-child(4){background:var(--mint)}

/* 圖卡：法律位階 */
.tiers{display:flex;flex-direction:column;align-items:center;gap:10px}
.tier{width:100%;text-align:center;padding:14px}
.tier b{font-size:20px;font-weight:900;display:block}
.tier p{margin:8px 0 0;font-size:15px;font-weight:500}
.tier .eg{display:inline-block;margin-top:8px}
.tier:nth-child(1){max-width:58%;background:var(--butter)}
.tier:nth-child(2){max-width:80%;background:var(--pink)}
.tier:nth-child(3){background:var(--mint)}

/* 集章 */
.bar{height:14px;border-radius:99px;border:2px solid var(--ink);background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);border-right:2px solid var(--ink)}
.stamp{width:150px;height:150px;border-radius:50%;border:5px solid var(--red);color:var(--red);display:grid;place-items:center;
  text-align:center;font-weight:900;font-size:26px;line-height:1.2;margin:8px auto;transform:rotate(-10deg);background:#fff;
  box-shadow:inset 0 0 0 4px #fff,inset 0 0 0 6px var(--red);animation:thud .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes thud{from{transform:rotate(-10deg) scale(2.4);opacity:0}}

/* 底部抽屜 */
.veil{position:absolute;inset:0;background:rgba(90,70,54,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--milk);border-top:2.5px solid var(--ink);border-radius:28px 28px 0 0;
  padding:8px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  transform:translateY(105%);transition:transform .38s cubic-bezier(.2,1.1,.3,1);max-height:78%;overflow-y:auto}
.open .veil{opacity:1;pointer-events:auto} .open .sheet{transform:none}
.grab{display:block;width:44px;height:5px;border-radius:9px;background:var(--hair);margin:4px auto 12px}
.line{display:flex;gap:10px;padding:12px 0;border-bottom:2px dashed var(--hair);font-size:15px}
.line:last-child{border:0}
.line .k{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:900;flex:none;background:#f4eee8}
.line.ok .k{background:var(--green);color:#fff}

/* 分頁列 */
nav{display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,253,249,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:2.5px solid var(--ink);padding:6px max(8px,env(safe-area-inset-right,0px)) 4px max(8px,env(safe-area-inset-left,0px))}
nav button{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:50px;justify-content:center;font-size:11px;font-weight:700;color:var(--ink2)}
nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{color:var(--ink)} nav button[aria-current=page] svg{fill:var(--pink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <main id="view"></main>
  <nav id="tabs" aria-label="主要分頁"></nav>
  <div class="veil" id="veil"></div>
  <section class="sheet" id="sheet" aria-label="每個選項的說明"></section>
</div>

<script>
const EXAM = new Date(2026, 11, 5);
const daysLeft = Math.max(0, Math.ceil((EXAM - new Date().setHours(0,0,0,0)) / 864e5));

// 示範用 3 題：考選部 115 年普通考試・行政法概要（官方題目與答案）。解析文字為示範。
const QS = [
 { src:'115 普考・行政法 第 8 題', topic:'地方制度法',
   stem:'中央主管機關對地方<mark class="b">自治條例</mark>設有<mark class="b">處罰規定</mark>者，有下列何種<mark class="b">事前</mark>監督方式？',
   plain:'市議會通過一條「亂丟垃圾要罰錢」的規定。<br>發布之前，要先送給中央做什麼？',
   opts:['備查','特許','核定','通報'], ans:2,
   ku:'要罰人，先問中央。有罰則就是「核定」。', trap:'備查是做完才告知，不是事前。',
   pic:'<div class="lane"><span class="hot">有罰則</span><i>→</i><span class="key">核定</span><i>→</i><span>發布</span></div><div class="lane off"><span>沒罰則</span><i>→</i><span>發布</span><i>→</i><span>備查</span></div>',
   why:['備查＝事後告知。沒有罰則才用這個。','特許不是自治法規的監督方式。','有罰則 → 先報中央核定，再發布。','法條沒有「通報」這種監督方式。'],
   law:'地方制度法 第 26 條第 4 項' },
 { src:'115 普考・行政法 第 34 題', topic:'行政執行法',
   stem:'下列行政執行行為，何者須由<mark class="b">法院裁定</mark>後為之？',
   plain:'欠稅不繳，執行機關想出手。<br>哪一招一定要先問過法官？',
   opts:['拘提','斷絕營業所必須之水電','禁止奢侈行為','對人之管束'], ans:0,
   ku:'要把人帶走，法官先點頭。', trap:'管束也限制人，但那是緊急當場做，不用法官。',
   pic:'<div class="lane"><span class="hot">拘提、管收</span><i>→</i><span class="key">法官點頭</span></div><div class="lane off"><span>斷水電、禁奢、管束</span><i>→</i><span>機關自己來</span></div>',
   why:['限制人身自由 → 要法院裁定。','執行機關自己就能做。','執行分署依申請核發，不必經法院。','情況緊急的即時強制，當場就做。'],
   law:'行政執行法 第 17 條' },
 { src:'115 普考・行政法 第 2 題', topic:'信賴保護原則',
   stem:'有關<mark class="b">信賴保護原則</mark>，下列敘述<mark class="r">何者錯誤</mark>？',
   plain:'政府說好的事突然變卦，人民可以主張「我是相信你才這樣做的」。<br>下面哪一句<mark class="r">說錯了</mark>？',
   opts:['基於公益撤銷授益處分，應給與損失補償','公益容許時，得讓違法行為繼續存在','源於法安定性與既得權之保障','僅限於處分之撤銷或廢止，不包括法規之變更'], ans:3,
   ku:'信賴保護是一把大傘，處分、法規都遮。', trap:'看到「僅限」「只有」，多半是錯的。',
   pic:'<svg width="170" height="74" viewBox="0 0 170 74" aria-hidden="true"><path d="M10 62Q85-42 160 62Q135 46 110 62Q85 46 60 62Q35 46 10 62Z" fill="#ffc2cf" stroke="#5a4636" stroke-width="2.5" stroke-linejoin="round"/><path d="M85 12V4" stroke="#5a4636" stroke-width="2.5" stroke-linecap="round"/></svg><div class="lane"><span class="key">處分</span><span class="key">法規</span></div>',
   why:['對。撤銷了就要補償。','對。這叫存續保障。','對。這是它的來源。','錯在「僅限」。法規變更也適用。'],
   law:'司法院釋字第 525 號' }
];

const S = { tab:'today', on:false, n:5, count:10, fast:true, subj:0, combo:0, i:0, pick:null, plain:false, score:0, done:false };
const PAW = '<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16" rx="6" ry="4.6"/><circle cx="5.5" cy="10" r="2.4"/><circle cx="12" cy="7" r="2.6"/><circle cx="18.5" cy="10" r="2.4"/></svg>';
const $ = id => document.getElementById(id);
const K = 'ABCD';

// 原創角色：八字臉的圓貓（奶茶色花紋）。mood: idle | yay | oops
const cat = (s=64, mood='idle') => `<svg width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true" style="flex:none">
 <path d="M11 28L14 7l15 10zM53 28L50 7 35 17z" fill="#c9ad94" stroke="#5a4636" stroke-width="2.5" stroke-linejoin="round"/>
 <ellipse cx="32" cy="39" rx="26" ry="21" fill="#fffdf9"/>
 <path d="M6 40Q6 19 30 18l-5 12q-9 3-13 14zM58 40Q58 19 34 18l5 12q9 3 13 14z" fill="#c9ad94"/>
 <ellipse cx="32" cy="39" rx="26" ry="21" fill="none" stroke="#5a4636" stroke-width="2.5"/>
 <ellipse cx="15" cy="46" rx="4.5" ry="3" fill="#ffc2cf"/><ellipse cx="49" cy="46" rx="4.5" ry="3" fill="#ffc2cf"/>
 ${mood==='yay' ? '<path d="M19 41q3.5-5 7 0M38 41q3.5-5 7 0" fill="none" stroke="#5a4636" stroke-width="2.5" stroke-linecap="round"/>'
               : '<circle cx="22.5" cy="40" r="2.8" fill="#5a4636"/><circle cx="41.5" cy="40" r="2.8" fill="#5a4636"/>'}
 ${mood==='oops' ? '<path d="M29 48h6" stroke="#5a4636" stroke-width="2.5" stroke-linecap="round"/><path d="M56 14q4 6 0 8q-4-2 0-8z" fill="#9fd0f0" stroke="#5a4636" stroke-width="1.8"/>'
                : '<path d="M27 46q2.5 3.5 5 0q2.5 3.5 5 0" fill="none" stroke="#5a4636" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'}</svg>`;

const TABS = [
 ['today','今日','<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/>'],
 ['cards','圖卡','<rect x="4" y="6" width="13" height="14" rx="3"/><path d="M8 3h9a3 3 0 0 1 3 3v10"/>'],
 ['quiz','刷題','<path d="M5 20l1-5L16 5l4 4L10 19z"/>'],
 ['stamps','集章','<circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>']
];

function views(){
 if (S.tab==='today') return `
  <h1>今日</h1>
  <div class="card count">${cat(76)}<div class="grow"><div class="sub" style="color:var(--ink)">距離筆試</div><div><b>${daysLeft}</b> 天</div><div class="sub" style="color:var(--ink)">12/5（六）・12/6（日）</div></div></div>
  <h2>今天的 3 個小任務</h2>
  ${[['行','行政法 5 題','約 3 分鐘','var(--butter)'],['地','地方自治 5 題','約 3 分鐘','var(--mint)'],['回','錯題回來看 5 題','3 天前答錯的','var(--pink)']].map((m,n)=>`
  <button class="card press mission" data-act="start5"><span class="dot" style="background:${m[3]}">${m[0]}</span>
   <span class="grow"><b>${m[1]}</b><br><span class="sub">${m[2]}</span></span><span class="go">${n?'等等':'開始'}</span></button>`).join('')}
  <h2>這週的章</h2>
  <div class="week">${['一','二','三','四','五','六','日'].map((d,n)=>`<i class="${n<3?'on':n===3?'today':''}">${n<3?'完成':d}</i>`).join('')}</div>
  <p class="sub">示範資料。正式版會依你的作答紀錄產生。</p>`;

 if (S.tab==='cards') return `
  <h1>圖卡</h1>
  <div><h2>法律位階</h2><p class="sub" style="margin:4px 0 0">誰說了算？點一層看一句。</p></div>
  <div class="tiers">${[['憲法','國家的最高規則。下面的都不能跟它衝突。','例：人民有工作權'],
    ['法律','立法院通過、總統公布。名字是法、律、條例、通則。','例：行政程序法'],
    ['命令','行政機關自己訂的。不能超出法律給的範圍。','例：施行細則、辦法']].map((t,n)=>`
   <button class="card press tier" data-tier="${n}" aria-expanded="false"><b>${t[0]}</b><span hidden><p>${t[1]}</p><span class="chip eg">${t[2]}</span></span></button>`).join('')}</div>
  <div class="say">${cat(52)}<div class="bubble"><small style="color:var(--blue)">記這句就好</small>上面的壓過下面的。</div></div>
  <div><h2>申論四格</h2><p class="sub" style="margin:4px 0 0">自治條例 vs 自治規則。四格寫完就是一題申論的骨架。</p></div>
  <div class="four">${[['① 誰訂的','條例：議會通過<br>規則：政府自己訂'],['② 叫什麼','條例：○○市××自治條例<br>規則：辦法、細則、準則'],
    ['③ 能罰嗎','條例：可以<br>規則：不行'],['④ 報給誰','有罰則：先核定<br>其他：發布後備查']].map((c,n)=>`
   <button class="card press cell" data-tier="f${n}" aria-expanded="false"><b>${c[0]}</b><span hidden><p>${c[1]}</p></span></button>`).join('')}</div>
  <p class="sub">地方制度法 第 25–27 條。示範內容。</p>`;

 if (S.tab==='stamps') return `
  <h1>集章</h1>
  ${[['行政法概要',38],['行政學概要',12],['地方自治概要',20],['法學知識與英文',6],['國文（測驗）',0]].map(s=>`
   <div class="card"><div class="row"><b class="grow">${s[0]}</b><span class="sub">${s[1]}%</span></div><div class="bar" style="margin-top:10px"><i style="width:${s[1]}%"></i></div></div>`).join('')}
  <p class="sub">示範資料。</p>`;

 if (!S.on) return `
  <h1>刷題</h1>
  <div class="card setup">
   <div class="row" style="justify-content:center">${cat(64,'yay')}<span class="sub" style="font-size:15px;font-weight:700;color:var(--ink)">這回合要刷幾題？</span></div>
   <div class="row"><button class="rnd press" data-step="-5" aria-label="少 5 題">−</button>
    <div class="num grow"><b>${S.count}</b> 題<div class="sub">大概 ${Math.max(1,Math.round(S.count*0.4))} 分鐘</div></div>
    <button class="rnd press" data-step="5" aria-label="多 5 題">＋</button></div>
   <div class="paws">${[5,10,20,30,50].map(n=>`<button class="paw" data-cnt="${n}" aria-pressed="${S.count===n}">${PAW}${n}</button>`).join('')}</div>
  </div>
  <h2>刷哪一科</h2>
  <div class="pick">${['全部','行政法','行政學','地方自治','法學知識','國文'].map((s,n)=>`<button data-subj="${n}" aria-pressed="${S.subj===n}">${s}</button>`).join('')}</div>
  <div class="card row"><div class="grow"><b>快刷模式</b><br><span class="sub">答對自動下一題，答錯才停下來看口訣</span></div>
   <button class="sw" role="switch" aria-checked="${S.fast}" data-act="fast" aria-label="快刷模式"></button></div>
  <button class="btn press" data-act="start">開始刷 ${S.count} 題</button>
  <p class="sub">原型只有 3 題示範題，會循環出現。</p>`;

 if (S.done) return `
  <div style="flex:1"></div>
  <div class="stamp">過關<br>成功</div>
  <div style="text-align:center"><h1>${S.score} / ${S.n}</h1><p class="sub" style="font-size:15px">${S.n-S.score ? `答錯的 ${S.n-S.score} 題，明天會再回來找你。` : '全對！'}</p></div>
  <div class="row" style="justify-content:center">${cat(96,'yay')}</div>
  <div style="flex:1"></div>
  <div class="acts"><button class="btn ghost press" data-act="home">回今日</button><button class="btn press" data-act="again">再刷 ${S.n} 題</button></div>`;

 const q = QS[S.i % QS.length], ans = S.pick!==null, ok = S.pick===q.ans;
 return `
  <div class="row"><div class="bar grow" aria-label="第 ${S.i+1} 題，共 ${S.n} 題"><i style="width:${(S.i+(ans?1:0))/S.n*100}%"></i></div>
   <span class="sub"><b>${S.i+1}</b> / ${S.n}</span>${S.combo>1?`<span class="chip">連對 ${S.combo}</span>`:''}<button class="chip plain" data-act="quit">結束</button></div>
  <div>
   <div class="row"><span class="chip">${q.topic}</span>
    <div class="seg" role="group" aria-label="題目版本"><button aria-pressed="${!S.plain}" data-plain="0">原文</button><button aria-pressed="${S.plain}" data-plain="1">白話</button></div></div>
   <p class="stem">${S.plain?q.plain:q.stem}</p>
   <span class="chip plain" style="margin-top:8px">${q.src}</span>
  </div>
  <div class="opts">${q.opts.map((o,n)=>`<button class="card press opt ${ans?(n===q.ans?'right':n===S.pick?'picked':'dim'):''}" data-opt="${n}" ${ans?'disabled':''}><span class="k">${K[n]}</span><span class="grow">${o}</span></button>`).join('')}</div>
  ${ans&&S.fast&&ok?`<div class="card kou"><div class="row">${cat(58,'yay')}<div class="grow"><small>答對！</small><b>${q.ku}</b></div></div></div>`
  :ans?`<div class="card kou ${ok?'':'miss'}"><div class="row">${cat(58,ok?'yay':'oops')}<div class="grow"><small>${ok?'答對了！口訣再記一次':'差一點！看這句馬上學會'}</small><b>${q.ku}</b></div></div>
   <div class="pic">${q.pic}</div><div class="trap"><em>陷阱</em><span>${q.trap}</span></div></div>
  <div class="acts"><button class="btn ghost press" data-act="sheet">看每個選項</button><button class="btn press" data-act="next">${S.i===S.n-1?'蓋章':'下一題'}</button></div>`:''}`;
}

function sheet(){
 const q = QS[S.i % QS.length];
 $('sheet').innerHTML = `<button class="grab" data-act="close" aria-label="關閉"></button>
  ${q.why.map((w,n)=>`<div class="line ${n===q.ans?'ok':''}"><span class="k">${K[n]}</span><span class="grow">${w}</span></div>`).join('')}
  <div style="margin-top:12px"><mark class="b">${q.law}</mark></div>`;
}

function render(keep){
 const v = $('view'), y = v.scrollTop;
 v.innerHTML = views();
 v.scrollTop = keep ? y : 0;
 $('tabs').innerHTML = TABS.map(t=>`<button data-tab="${t[0]}" ${S.tab===t[0]?'aria-current="page"':''}><svg viewBox="0 0 24 24">${t[2]}</svg>${t[1]}</button>`).join('');
}
function start(n){ Object.assign(S,{tab:'quiz',on:true,n,i:0,pick:null,plain:false,score:0,combo:0,done:false}); render(); }
function next(){ if (S.pick===null) return; if (S.i===S.n-1) S.done=true; else { S.i++; S.pick=null; S.plain=false; } render(); }

$('app').addEventListener('click', e=>{
 const b = e.target.closest('button');
 if (e.target.id==='veil') return $('app').classList.remove('open');
 if (!b) return;
 const d = b.dataset;
 if (d.tab){ S.tab=d.tab; if (d.tab==='quiz' && S.done) S.on=false; return render(); }
 if (d.cnt){ S.count=+d.cnt; return render(true); }
 if (d.step){ S.count=Math.min(100,Math.max(5,S.count+ +d.step)); return render(true); }
 if (d.subj){ S.subj=+d.subj; return render(true); }
 if (d.act==='fast'){ S.fast=!S.fast; return render(true); }
 if (d.act==='start5') return start(5);
 if (d.act==='again') return start(S.n);
 if (d.act==='quit'){ const did=S.i+(S.pick!==null?1:0); if (did){ S.n=did; S.done=true; } else S.on=false; return render(); }
 if (d.plain!==undefined){ S.plain = d.plain==='1'; return render(true); }
 if (d.opt!==undefined){
  S.pick=+d.opt; const ok=S.pick===QS[S.i % QS.length].ans, at=S.i;
  if (ok){ S.score++; S.combo++; } else S.combo=0;
  render(true); $('view').scrollTo({top:9e4,behavior:'smooth'});
  if (ok && S.fast) setTimeout(()=>{ if (S.on && !S.done && S.tab==='quiz' && S.i===at && S.pick!==null) next(); }, 1200);
  return;
 }
 if (d.tier!==undefined){ const s=b.querySelector('span[hidden],span:not(.chip)'); const open=b.getAttribute('aria-expanded')==='true'; s.hidden=open; return b.setAttribute('aria-expanded',!open); }
 if (d.act==='start') return start(S.count);
 if (d.act==='home'){ S.tab='today'; S.on=false; return render(); }
 if (d.act==='next') return next();
 if (d.act==='sheet'){ sheet(); return $('app').classList.add('open'); }
 if (d.act==='close') return $('app').classList.remove('open');
});

// 左滑下一題（作答後）；抽屜下拉關閉
let sx=0, sy=0;
$('app').addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
$('app').addEventListener('touchend', e=>{
 const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
 if ($('app').classList.contains('open')){ if (dy>60 && $('sheet').scrollTop===0) $('app').classList.remove('open'); return; }
 if (S.tab==='quiz' && !S.done && dx<-70 && Math.abs(dy)<50) next();
}, {passive:true});

render();
</script>
