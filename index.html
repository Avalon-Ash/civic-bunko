<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="民政刷題" />
    <meta name="theme-color" content="#e6f4fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b2126" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <title>民政刷題</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;700;900&display=swap" />
    <style>
      /* 啟動畫面：寫在 HTML 裡，程式還沒載入就看得到；React 掛上後會整個換掉。 */
      html, body, #root { height: 100%; margin: 0; }
      body { background: #e6f4fa; }
      .boot { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        font-family: 'Chiron GoRound TC', 'PingFang TC', -apple-system, sans-serif; color: #5a4636;
        background: linear-gradient(#e6f4fa 0, #f3fbf4 62%, #dff3dc 100%); }
      .boot-cat { width: 112px; height: 112px; display: block; border-radius: 28px; border: 3px solid #5a4636; box-shadow: 0 5px 0 #5a4636;
        animation: boot-bob 1.1s ease-in-out infinite; }
      .boot b { font-size: 22px; font-weight: 900; letter-spacing: 0.06em; }
      .boot span { font-size: 14px; color: #9b8878; }
      .boot i { display: inline-block; width: 7px; height: 7px; margin: 0 3px; border-radius: 50%; background: #ee8199;
        animation: boot-dot 1s ease-in-out infinite; }
      .boot i:nth-child(2) { animation-delay: 0.15s; } .boot i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes boot-bob { 50% { transform: translateY(-8px); } }
      @keyframes boot-dot { 0%, 100% { opacity: 0.25; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.15); } }
      @media (prefers-color-scheme: dark) {
        body { background: #1b2126; }
        .boot { color: #f3e9dc; background: linear-gradient(#1b2126 0, #1b231d 100%); }
        .boot-cat { border-color: #a08c7a; box-shadow: 0 5px 0 #a08c7a; }
        .boot span { color: #b5a595; }
      }
      @media (prefers-reduced-motion: reduce) { .boot-cat, .boot i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <svg class="boot-cat" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" fill="#ffc2cf" />
          <g transform="translate(6.4 8.3) scale(0.8)">
            <path d="M9 30L12 5l18 13zM55 30L52 5 34 18z" fill="#c9ad94" stroke="#5a4636" stroke-width="2.6" stroke-linejoin="round" />
            <ellipse cx="32" cy="39" rx="26" ry="21" fill="#fffdf9" />
            <path d="M6 40Q6 19 30 18l-5 12q-9 3-13 14zM58 40Q58 19 34 18l5 12q9 3 13 14z" fill="#c9ad94" />
            <ellipse cx="32" cy="39" rx="26" ry="21" fill="none" stroke="#5a4636" stroke-width="2.6" />
            <ellipse cx="14.5" cy="46" rx="4.6" ry="3.1" fill="#ff9fb4" /><ellipse cx="49.5" cy="46" rx="4.6" ry="3.1" fill="#ff9fb4" />
            <circle cx="22.5" cy="40" r="2.9" fill="#5a4636" /><circle cx="41.5" cy="40" r="2.9" fill="#5a4636" />
            <path d="M27 46.5q2.5 3.6 5 0q2.5 3.6 5 0" fill="none" stroke="#5a4636" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </g>
        </svg>
        <b>民政刷題</b>
        <span>題庫準備中</span>
        <div aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
